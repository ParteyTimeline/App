name: Docker release

# Fires alongside the Android release, on the same android-v* tag (this repo
# doesn't version the server separately from the app) — publishes the same
# server code as a container image to GitHub Container Registry, so a
# self-hoster can `docker pull` a specific release instead of building the
# Dockerfile themselves.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing android-v* tag to rebuild and re-publish'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Determine version and image name
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${tag#android-v}" >> "$GITHUB_OUTPUT"
          # Image names must be lowercase; the repo (ParteyTimeline/App)
          # isn't, so it can't be used as-is.
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
