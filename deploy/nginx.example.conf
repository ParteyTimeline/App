# Example reverse-proxy config for serving Partey Timeline under a subpath
# of an existing domain (e.g. https://your-domain.example/partey/), with an
# nginx that's already terminating TLS for other sites.
#
# Adjust `your-domain.example`, the subpath, and the upstream port
# (127.0.0.1:4001 matches the default docker-compose.yml mapping) to match
# your own setup, then include this in the relevant `server { }` block.
#
# The Upgrade/Connection headers are required — without them the WebSocket
# connection the game relies on for live state fails to establish.

location = /partey {
    return 301 /partey/;
}

location /partey/ {
    proxy_pass              http://127.0.0.1:4001/;
    proxy_http_version      1.1;
    proxy_set_header        Host $http_host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_read_timeout      3600s;
}

# If you're instead serving the app at the domain root, a much simpler
# `location / { proxy_pass http://127.0.0.1:4001; ... }` (same headers) in
# its own server block works too — the subpath dance above is only needed
# when sharing a domain with other existing sites/paths.
