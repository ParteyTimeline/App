services:
  partey-timeline:
    build: .
    image: partey-timeline:latest
    container_name: partey-timeline
    restart: unless-stopped
    # Bound to loopback only — meant to sit behind a reverse proxy that
    # terminates TLS and forwards to this port, never exposed directly.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - COOKIE_SECURE=1
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
